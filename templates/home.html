{% extends "base.html" %}{% block content %}<h1>Workspace</h1><form class="panel" method="post" action="/project/create/">{% csrf_token %}<h3>Create a project</h3><input name="name" placeholder="Project name" required><textarea name="description" placeholder="Description"></textarea><button>Create project</button></form><div class="grid">{% for p in projects %}<a class="card" href="/project/{{ p.id }}/"><h2>{{ p.name }}</h2><p>{{ p.description }}</p><p>{{ p.tasks.count }} tasks · {{ p.members.count }} members</p></a>{% empty %}<p>Create your first project to get started.</p>{% endfor %}</div>{% endblock %}
